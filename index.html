<!doctype html>
<!--
  Clip Shoutout — OBS browser source
  ----------------------------------
  When a mod, a VIP or the broadcaster types "!so somestreamer" in chat, a comic-book shoutout card pops up
  with that streamer's picture, name, link and what they were last playing, and one of their clips plays in
  it. The clip is picked at random (never the one they got last time, if they have more than one). Shoutouts
  given while one is showing wait in a queue and play one after another. If they have no clips, or the
  channel can't be found, the card still shows on its own for a few seconds.

  Clips come from the platform the shoutout was typed on: Twitch chat shouts out Twitch channels, Kick chat
  Kick channels. "!so kick.com/name", "!so twitch.tv/name", "!so kick:name" or "!so twitch:name" pick the
  platform outright. YouTube and TikTok have no clips to show, so shoutouts typed there look the name up on
  Twitch by default (see "lookup").

  OBS: Add > Browser, URL https://clips.ixitxachitl.com/?channel=yourchannel, at your canvas size (e.g.
       1920x1080). Tick "Control audio via OBS" if you want the clips' sound on its own mixer slider.

  CONTROLS: in OBS, right-click this source → Interact and move the mouse over the overlay. The bar in the
  bottom-right corner shouts out a name you type and skips the current shoutout; the gear opens the settings.
  Every setting can also be a URL parameter, which overrides it.

  Chat (all read anonymously, no login needed):
    channel   Twitch channel          kick      Kick channel
    tiktok    TikTok bridge: 1 = TikFinity on this PC, or a ws:// address
    youtube   a live video ID or link (needs ytkey), or a ws:// bridge
    ytkey     YouTube Data API v3 key ytpoll    seconds between YouTube checks (default 6)
    demo      1 = a fake mod gives a shoutout every so often, for trying it out

  Shoutouts:
    socmd     the shoutout command (default !so)
    who       who can use it besides the broadcaster: mods, vips (mods and VIPs, the default), everyone, or
              owner (only the broadcaster)
    allow     more names that can use it, comma separated
    skipcmd   mods and the broadcaster: skip the current shoutout (default !soskip; "!soskip all" also
              empties the queue)
    maxqueue  most shoutouts waiting at once (default 10)
    lookup    shoutouts typed in YouTube / TikTok chat look up: twitch (default), kick or none

  Clips:
    period    all (default), month, week or day: how recent the clips can be
    top       pick from only the N most-viewed clips (default 0 = any of the 100 most viewed)
    maxlen    prefer clips up to this many seconds (default 60; 0 = any length). If all are longer, one is
              cut off here.
    quality   highest video quality to use: 1080 (default), 720, 480 or 360
    volume    0-100 (default 80)

  Look:
    pos       center (default), top, bottom, tl, tr, bl or br
    size      card width, % of the source (default 42)
    cardtime  seconds a shoutout without a clip stays up (default 8)
    gap       seconds between shoutouts in the queue (default 1.5)
    tagline   the line under the name (default "Go give them a follow!"; empty = none)
    title     1 = show the clip's title and who clipped it (default 1)
    game      1 = show what they were last playing (default 1)
    bg        testing: none = transparent in a normal browser too, or a color (default: dark outside OBS)

  Custom integrations (Streamer.bot, etc.) can call window.clips.shoutout(name, { platform }), .skip() and
  .clear().

  Twitch channels and clips are looked up with the same public, logged-out requests twitch.tv makes for its
  own visitors, so there's nothing to log in to. Kick's come from its public channel API.
-->
<html>
<head>
<meta charset="utf-8">
<title>Clip Shoutout</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100%;height:100%}
  :root{--ink:#111;--paper:#fff;--yellow:#fff27a;--pink:#ff2bd6;--violet:#7a5cff;--cyan:#00e5ff;--green:#39ff88;--sun:#ffe600;
    --plat:#9146ff;--dots:radial-gradient(circle,rgba(0,0,0,.13) 1.2px,transparent 1.7px) 0 0/8px 8px;
    --head:'Bangers',Impact,sans-serif;--txt:'Comic Neue',system-ui,sans-serif}

  /* ---------- the shoutout card ---------- */
  /* Everything inside is sized in em, and the font size follows the card's width (24em = `size`% of the source). */
  #so{--size:42;position:fixed;width:24em;font:700 calc(var(--size) * 1vw / 24)/1.25 var(--txt);color:var(--ink);
    pointer-events:none;visibility:hidden;transition:visibility 0s .45s}
  #so.show{visibility:visible;transition:none}
  #so.pos-center{left:50%;top:50%;translate:-50% -50%}
  #so.pos-top{left:50%;top:4vh;translate:-50% 0}
  #so.pos-bottom{left:50%;bottom:4vh;translate:-50% 0}
  #so.pos-tl{left:3vw;top:4vh}
  #so.pos-tr{right:3vw;top:4vh}
  #so.pos-bl{left:3vw;bottom:4vh}
  #so.pos-br{right:3vw;bottom:4vh}

  .burst{position:relative;z-index:3;display:inline-block;margin:0 0 -.55em -.4em;padding:.12em .55em .02em;
    font:2.1em/1 var(--head);letter-spacing:.04em;color:var(--sun);background:var(--pink);
    border:.12em solid var(--ink);border-radius:.18em;box-shadow:.14em .14em 0 var(--ink);
    -webkit-text-stroke:.05em var(--ink);paint-order:stroke fill;text-shadow:.06em .06em 0 var(--ink);
    rotate:-4deg;scale:0;transition:scale .35s cubic-bezier(.3,1.6,.5,1) .05s}
  #so.show .burst{scale:1}
  .frame{position:relative;z-index:1;background:var(--ink);border:.22em solid var(--ink);border-radius:.35em;overflow:hidden;
    box-shadow:0 0 0 .14em var(--paper),.4em .4em 0 .14em var(--ink);aspect-ratio:16/9;
    opacity:0;translate:0 .8em;transition:opacity .3s,translate .35s cubic-bezier(.3,1.4,.5,1)}
  #so.show .frame{opacity:1;translate:0 0}
  #so.noclip .frame{display:none}
  #vid,#emb{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;display:none}
  #vid.on,#emb.on{display:block}
  #vid{object-fit:contain}
  /* the clip's title: a yellow narration box in the top-left corner, and who clipped it at the bottom */
  .cap{position:absolute;left:.5em;top:.5em;z-index:2;max-width:75%;padding:.25em .55em .2em;background:var(--yellow);
    border:.12em solid var(--ink);box-shadow:.14em .14em 0 var(--ink);font:1.05em/1.15 var(--head);letter-spacing:.03em;
    rotate:-1.5deg;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{position:absolute;right:.5em;bottom:.85em;z-index:2;padding:.15em .5em;background:rgba(17,17,17,.75);color:#fff;
    border-radius:1em;font-size:.62em}
  .cap:empty,.meta:empty,#so.notitle .cap,#so.notitle .meta{display:none}
  .bar{position:absolute;left:0;right:0;bottom:0;height:.32em;z-index:2;background:rgba(0,0,0,.5)}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--violet),var(--cyan))}

  .plate{position:relative;z-index:2;display:flex;align-items:center;gap:.7em;margin:-.5em .9em 0;padding:.6em .9em .6em .6em;
    background:var(--dots),var(--paper);border:.18em solid var(--ink);border-radius:.45em;box-shadow:.3em .3em 0 var(--ink);
    opacity:0;translate:0 1.2em;transition:opacity .3s .1s,translate .4s cubic-bezier(.3,1.4,.5,1) .1s}
  #so.show .plate{opacity:1;translate:0 0}
  #so.noclip .plate{margin:0;padding:.9em 1.1em .9em .9em;font-size:1.25em}
  .ava{position:relative;flex:none;width:3.6em;height:3.6em;border-radius:50%;border:.16em solid var(--ink);overflow:hidden;
    background:var(--plat);box-shadow:.12em .12em 0 var(--ink);display:grid;place-items:center}
  .ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
  .ava img.on{display:block}
  .ava b{font:1.9em/1 var(--head);color:#fff;-webkit-text-stroke:.04em var(--ink);paint-order:stroke fill}
  .who{min-width:0;flex:1}
  .name{font:2.1em/1 var(--head);letter-spacing:.03em;color:var(--paper);-webkit-text-stroke:.07em var(--ink);paint-order:stroke fill;
    text-shadow:.07em .07em 0 var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:.06em .1em 0 0}
  .line{margin-top:.15em;font-size:.82em;color:#4a4560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .line b{color:var(--ink)}
  .line .live{display:inline-block;margin-right:.35em;padding:0 .35em;background:#ff2a4a;color:#fff;border-radius:.25em;font-size:.85em}
  .url{display:inline-flex;align-items:center;gap:.4em;margin-top:.35em;padding:.15em .55em .1em .2em;background:var(--yellow);
    border:.12em solid var(--ink);border-radius:1em;font-size:.82em;max-width:100%;box-sizing:border-box}
  .url span{flex:none;padding:0 .45em;border-radius:1em;background:var(--plat);color:#fff;font:1em/1.35 var(--head);letter-spacing:.04em}
  .url em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{margin-top:.3em;font-size:.82em}
  .line:empty,.tag:empty,.url.off{display:none}
  /* how many more are waiting */
  .more{position:absolute;right:-.3em;top:-.1em;z-index:3;padding:.15em .55em .05em;font:1em/1.1 var(--head);letter-spacing:.04em;
    background:var(--cyan);border:.12em solid var(--ink);border-radius:1em;box-shadow:.1em .1em 0 var(--ink);rotate:4deg;
    opacity:0;transition:opacity .3s .2s}
  #so.show .more:not(:empty){opacity:1}

  #toast{position:fixed;left:50%;bottom:24px;translate:-50% 0;z-index:30;padding:9px 14px 7px;font:700 16px/1.3 var(--txt);
    background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);
    opacity:0;transition:opacity .3s;pointer-events:none;max-width:80vw;text-align:center}
  #toast.show{opacity:1}

  /* ---------- host bar and the settings window (only visible while you interact with the source) ---------- */
  .btn{font:18px/1 var(--head);letter-spacing:.05em;padding:9px 14px 7px;border:3px solid var(--ink);border-radius:10px;background:var(--paper);
    color:var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .06s}
  .btn:hover{transform:translate(-1px,-2px)}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .btn.go{background:var(--pink);color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
  .btn.warn{background:var(--yellow)}
  .btn:disabled{opacity:.45;cursor:default;transform:none}
  #host{position:fixed;right:84px;bottom:22px;z-index:1000;display:flex;gap:10px;align-items:center;opacity:0;pointer-events:none;transition:opacity .25s}
  body.mouse #host,#host:focus-within{opacity:1;pointer-events:auto}
  #host input{width:190px;font:700 16px var(--txt);padding:8px 10px;border:3px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);outline:0}
  #host input:focus{border-color:var(--violet)}
  #gear{position:fixed;right:20px;bottom:20px;width:50px;height:50px;z-index:1000;border:3px solid var(--ink);border-radius:50%;
    background:var(--sun);box-shadow:3px 3px 0 var(--ink);cursor:pointer;display:grid;place-items:center;opacity:0;pointer-events:none;
    transition:opacity .25s,transform .2s}
  body.mouse #gear{opacity:1;pointer-events:auto}
  #gear:hover{transform:rotate(30deg)}
  #gear svg{width:28px;height:28px}
  #settings{position:fixed;inset:0;z-index:1001;display:none;align-items:center;justify-content:center;
    background:rgba(18,10,38,.7);pointer-events:auto;font:700 15px/1.35 var(--txt);color:var(--ink)}
  #settings.open{display:flex}
  .sp{width:min(900px,92vw);max-height:90vh;display:flex;flex-direction:column;background:var(--paper);border:4px solid var(--ink);
    border-radius:16px;box-shadow:8px 8px 0 var(--ink);overflow:hidden}
  .sp-head{padding:16px 22px 12px;background:var(--dots),var(--pink);border-bottom:4px solid var(--ink)}
  .sp-head h2{margin:0;font:32px/1 var(--head);letter-spacing:.04em;color:var(--sun);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;
    text-shadow:3px 3px 0 var(--ink)}
  .sp-head p{margin:8px 0 0;font-size:14px;color:#fff}
  .sp-body{overflow:auto;padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;background:var(--dots),#f4f1ff}
  .sp-sec{padding:12px 14px 14px;background:var(--paper);border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink)}
  .sp-sec h3{margin:0 0 10px;font:22px/1 var(--head);letter-spacing:.04em;color:var(--violet)}
  .sp-f{margin:0 0 12px}
  .sp-f:last-child{margin-bottom:0}
  .sp-f label{display:block;margin-bottom:4px}
  .sp-f input[type=text],.sp-f input[type=password],.sp-f input[type=number],.sp-f select{width:100%;box-sizing:border-box;
    font:700 15px var(--txt);padding:7px 9px;border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
  .sp-f input:focus,.sp-f select:focus{outline:3px solid var(--cyan);outline-offset:1px}
  .sp-f input:disabled,.sp-f select:disabled{background:#e8e6ef;color:#6a6278}
  .sp-f small{display:block;margin-top:5px;font-size:13px;color:#4a4560}
  .sp-f small.url{color:#c2185b}
  .sp-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .sp-row label{margin:0}
  .sw{position:relative;width:46px;height:24px;flex:none}
  .sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
  .sw i{position:absolute;inset:0;background:#d6d2e2;border:2px solid var(--ink);border-radius:20px}
  .sw i::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border:2px solid var(--ink);border-radius:50%;
    box-sizing:border-box;transition:transform .12s ease-out}
  .sw input:checked + i{background:var(--green)}
  .sw input:checked + i::after{transform:translateX(22px)}
  .sw input:disabled + i{opacity:.5}
  .sp-foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 22px;background:var(--yellow);border-top:4px solid var(--ink)}
  .sp-foot .grow{flex:1}
  .sp-msg{font-size:14px;color:#c2185b;min-height:1em}
  .sp-link{width:100%;font:12px monospace;padding:6px;border:2px solid var(--ink);border-radius:6px;display:none;margin-top:4px}
  @media (max-height:560px){
    #settings{align-items:flex-start}
    .sp{max-height:none;height:100vh;overflow:auto;display:block;border-radius:0}
    .sp-head p{display:none}
    .sp-body{overflow:visible}
  }
</style>
</head>
<body>
<div id="so" class="pos-center noclip">
  <div class="burst">SHOUTOUT!</div>
  <div class="frame"><video id="vid" playsinline preload="auto"></video><iframe id="emb" allow="autoplay" title="Clip"></iframe>
    <div class="cap" id="cap"></div><div class="meta" id="meta"></div><div class="bar"><i id="prog"></i></div></div>
  <div class="plate"><div class="ava"><img id="ava" alt=""><b id="ini"></b></div>
    <div class="who"><div class="name" id="nm"></div><div class="line" id="game"></div>
      <div class="url" id="url"><span id="plat"></span><em id="link"></em></div><div class="tag" id="tag"></div></div>
    <div class="more" id="more"></div></div>
</div>
<div id="toast"></div>
<script>
(() => {
  // ---------------- settings (saved locally; URL parameters override) ----------------
  const Q = new URLSearchParams(location.search);
  const STORE_KEY = 'clips.settings.v1';
  let saved = {}, storageOK = true;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { storageOK = false; }
  const FIELDS = [
    { sec: 'Chat' },
    { k: 'channel', label: 'Twitch channel', type: 'text', def: '', ph: 'yourchannel', help: 'Read anonymously, no login needed.' },
    { k: 'kick', label: 'Kick channel', type: 'text', def: '', ph: 'yourchannel', help: 'Read anonymously, no login needed.' },
    { k: 'tiktok', label: 'TikTok bridge', type: 'text', def: '', ph: '1 = TikFinity, or ws://…', help: 'TikTok needs a local bridge app. "1" uses TikFinity on this PC.' },
    { k: 'youtube', label: 'YouTube live', type: 'text', def: '', ph: 'video ID / link, or ws://…', help: 'A live video ID or link (needs the API key below), or a bridge address.' },
    { k: 'ytkey', label: 'YouTube API key', type: 'password', def: '', help: 'YouTube Data API v3 key from Google Cloud Console.' },
    { k: 'ytpoll', label: 'YouTube check every (s)', type: 'num', def: 6, min: 2, max: 60, step: 1, help: 'Lower = snappier, but uses the daily API quota faster.' },
    { k: 'demo', label: 'Demo chat', type: 'bool', def: false, help: 'A fake mod gives a shoutout every so often, for trying it out.' },
    { sec: 'Shoutouts' },
    { k: 'socmd', label: 'Shoutout command', type: 'text', def: '!so', help: 'Followed by a name: "!so somestreamer" (an @ in front is fine).' },
    { k: 'who', label: 'Who can use it', type: 'select', def: 'vips', opts: [['owner', 'Only the broadcaster'], ['mods', 'Mods'], ['vips', 'Mods and VIPs'], ['everyone', 'Everyone']],
      help: 'The broadcaster always can. VIPs are a Twitch and Kick thing.' },
    { k: 'allow', label: 'These people can too', type: 'text', def: '', ph: 'friend1, friend2', help: 'Names that can shout out whoever "Who can use it" says.' },
    { k: 'skipcmd', label: 'Skip command', type: 'text', def: '!soskip', help: 'Mods and the broadcaster: skips the shoutout on screen. Add "all" to empty the queue too.' },
    { k: 'maxqueue', label: 'Most waiting in the queue', type: 'num', def: 10, min: 1, max: 50, step: 1 },
    { k: 'lookup', label: 'YouTube & TikTok shoutouts look up', type: 'select', def: 'twitch', opts: [['twitch', 'Twitch'], ['kick', 'Kick'], ['none', 'Nobody (just the card)']],
      help: "YouTube and TikTok have no clips to show, so a name shouted out there is looked up here." },
    { sec: 'Clips' },
    { k: 'period', label: 'Clips from', type: 'select', def: 'all', opts: [['all', 'All time'], ['month', 'The last month'], ['week', 'The last week'], ['day', 'The last day']] },
    { k: 'top', label: 'Only the top N clips', type: 'num', def: 0, min: 0, max: 100, step: 1, help: 'Pick at random from their N most-viewed clips. 0 = any of the 100 most viewed.' },
    { k: 'maxlen', label: 'Longest clip (s)', type: 'num', def: 60, min: 0, max: 180, step: 5, help: 'Shorter clips are picked first. If all are longer, one is cut off here. 0 = any length.' },
    { k: 'quality', label: 'Video quality', type: 'select', def: '1080', opts: [['1080', 'Up to 1080p'], ['720', 'Up to 720p'], ['480', 'Up to 480p'], ['360', '360p']] },
    { k: 'volume', label: 'Volume', type: 'num', def: 80, min: 0, max: 100, step: 5 },
    { sec: 'Look' },
    { k: 'pos', label: 'Position', type: 'select', def: 'center', opts: [['center', 'Center'], ['top', 'Top'], ['bottom', 'Bottom'], ['tl', 'Top left'], ['tr', 'Top right'], ['bl', 'Bottom left'], ['br', 'Bottom right']] },
    { k: 'size', label: 'Size (% of the width)', type: 'num', def: 42, min: 15, max: 90, step: 1 },
    { k: 'cardtime', label: 'Card without a clip (s)', type: 'num', def: 8, min: 2, max: 60, step: 1, help: 'How long a shoutout stays up when they have no clips.' },
    { k: 'gap', label: 'Gap between shoutouts (s)', type: 'num', def: 1.5, min: 0, max: 30, step: 0.5 },
    { k: 'tagline', label: 'Tagline', type: 'text', def: 'Go give them a follow!', help: 'Under the name. Leave it empty for none.' },
    { k: 'title', label: "Clip title and who clipped it", type: 'bool', def: true },
    { k: 'game', label: 'What they last played', type: 'bool', def: true },
  ];
  const FIELD = Object.fromEntries(FIELDS.filter(f => f.k).map(f => [f.k, f]));
  function coerce(f, v) {
    if (f.type === 'bool') return v === true || v === 1 || /^(1|true|yes|on)$/i.test(String(v));
    if (f.type === 'num') { const n = parseFloat(v); return isNaN(n) ? f.def : Math.min(f.max, Math.max(f.min, n)); }
    if (f.type === 'select') return f.opts.some(o => o[0] === v) ? v : f.def;
    return String(v ?? '').trim();
  }
  const fromURL = {};
  for (const f of Object.values(FIELD)) if (Q.has(f.k)) fromURL[f.k] = coerce(f, Q.get(f.k));
  const SET = {};
  for (const f of Object.values(FIELD)) SET[f.k] = f.k in fromURL ? fromURL[f.k] : f.k in saved ? coerce(f, saved[f.k]) : f.def;
  const cmdOf = (v, d) => (v || d).toLowerCase().split(/\s+/)[0];
  const CFG = {
    ...SET,
    channel: SET.channel.replace(/^.*twitch\.tv\//i, '').replace(/^#/, '').replace(/[/?#].*$/, '').toLowerCase(),
    kick: SET.kick.replace(/^.*kick\.com\//i, '').replace(/[/?#].*$/, '').toLowerCase(),
    tiktok: SET.tiktok === '1' ? 'ws://localhost:21213/' : SET.tiktok,
    socmd: cmdOf(SET.socmd, '!so'), skipcmd: cmdOf(SET.skipcmd, '!soskip'),
  };
  const ALLOW = new Set(CFG.allow.toLowerCase().split(/[\s,]+/).map(s => s.replace(/^@/, '')).filter(Boolean));

  // Preview background outside OBS so you can actually see it in a browser
  const bgq = Q.get('bg');
  if (bgq && bgq !== 'none') document.body.style.background = bgq;
  else if (!bgq && !window.obsstudio) document.body.style.background = '#1a0f33';

  const $ = id => document.getElementById(id);
  const so = $('so'), vid = $('vid'), emb = $('emb');
  so.classList.replace('pos-center', 'pos-' + CFG.pos);
  so.style.setProperty('--size', CFG.size);
  so.classList.toggle('notitle', !CFG.title);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const fmt = new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 });

  let toastT;
  function toast(text) {
    const t = $('toast'); t.textContent = text; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3500);
  }

  // ---------------- looking up channels and clips ----------------
  const PLATS = {
    twitch: { label: 'Twitch', color: '#9146ff', url: n => 'twitch.tv/' + n },
    kick: { label: 'Kick', color: '#2fd10a', url: n => 'kick.com/' + n },
  };
  // Twitch's own website client ID: twitch.tv makes these same logged-out requests for its visitors, so
  // nobody has to log in or register an app.
  const GQL_ID = 'kimne78kx3ncx6brgo4mv6wki5h1ko';
  async function gql(query) {
    const r = await fetch('https://gql.twitch.tv/gql', { method: 'POST', headers: { 'Client-Id': GQL_ID }, body: JSON.stringify({ query }) });
    const j = await r.json();
    if (j.errors) throw new Error(j.errors.map(e => e.message).join('; '));
    return j.data;
  }
  const PERIOD = { all: 'ALL_TIME', month: 'LAST_MONTH', week: 'LAST_WEEK', day: 'LAST_DAY' };
  async function twitchInfo(login) {
    if (!/^\w{1,25}$/.test(login)) return null;
    const d = await gql(`query{user(login:${JSON.stringify(login)}){login displayName profileImageURL(width:300) lastBroadcast{game{displayName}}
      stream{game{displayName}} clips(first:100,criteria:{period:${PERIOD[CFG.period]}}){edges{node{slug title durationSeconds viewCount curator{displayName}}}}}}`);
    const u = d.user;
    if (!u) return null;
    return {
      login: u.login, name: u.displayName || u.login, avatar: u.profileImageURL, live: !!u.stream,
      game: u.stream?.game?.displayName || u.lastBroadcast?.game?.displayName || '',
      clips: (u.clips?.edges || []).map(({ node: c }) => ({ id: c.slug, title: c.title, dur: c.durationSeconds, views: c.viewCount, by: c.curator?.displayName || '' })),
    };
  }
  async function kickInfo(name) {
    // (Kick's channel slugs have dashes where the usernames have underscores)
    const slug = name.toLowerCase().replace(/_/g, '-');
    if (!/^[\w-]{1,30}$/.test(slug)) return null;
    const get = async u => { const r = await fetch(u, { headers: { Accept: 'application/json' } }); return r.ok ? r.json() : null; };
    const base = `https://kick.com/api/v2/channels/${encodeURIComponent(slug)}`;
    const [ch, cl] = await Promise.all([get(base), get(`${base}/clips?sort=view&time=${CFG.period}`).catch(() => null)]);
    if (!ch) return null;
    const live = ch.livestream;
    return {
      login: ch.slug || slug, name: ch.user?.username || name, avatar: ch.user?.profile_pic || '', live: !!live,
      game: live?.categories?.[0]?.name || ch.recent_categories?.[0]?.name || '',
      clips: (cl?.clips || []).filter(c => c.video_url || c.clip_url)
        .map(c => ({ id: c.id, title: c.title, dur: c.duration, views: c.views ?? c.view_count, by: c.creator?.username || '', hls: c.video_url || c.clip_url })),
    };
  }
  // Lookups are kept for 10 minutes, so a queue of the same few names doesn't ask again every time.
  const infoCache = new Map();
  function lookup(platform, login) {
    const key = platform + ':' + login.toLowerCase(), hit = infoCache.get(key);
    if (hit && performance.now() - hit.at < 600000) return hit.p;
    const p = (platform === 'twitch' ? twitchInfo(login.toLowerCase()) : kickInfo(login)).catch(e => { console.warn('[clips] lookup failed:', key, e); infoCache.delete(key); return null; });
    infoCache.set(key, { at: performance.now(), p });
    return p;
  }

  // The last clip each channel got, so the next shoutout picks a different one (remembered across reloads)
  const LAST_KEY = 'clips.last.v1';
  let lastClip = {};
  try { lastClip = JSON.parse(localStorage.getItem(LAST_KEY) || '{}') || {}; } catch (e) {}
  function pickClip(key, clips) {
    let pool = CFG.top ? clips.slice(0, CFG.top) : clips;
    const fits = pool.filter(c => !CFG.maxlen || c.dur <= CFG.maxlen);
    if (fits.length) pool = fits;
    if (pool.length > 1) pool = pool.filter(c => c.id !== lastClip[key]);
    const c = pool.length ? pick(pool) : null;
    if (c) {
      lastClip[key] = c.id;
      try { localStorage.setItem(LAST_KEY, JSON.stringify(lastClip)); } catch (e) {}
    }
    return c;
  }
  // Where a clip's video is: Twitch hands out a signed MP4 per quality; Kick clips are HLS playlists.
  async function clipSource(platform, c) {
    if (platform === 'kick') return { type: 'hls', url: c.hls };
    if (!/^[\w-]+$/.test(c.id)) return null;
    const d = await gql(`query{clip(slug:${JSON.stringify(c.id)}){playbackAccessToken(params:{platform:"web",playerBackend:"mediaplayer",playerType:"site"}){signature value}
      videoQualities{quality sourceURL}}}`);
    const tok = d.clip?.playbackAccessToken, qs = (d.clip?.videoQualities || []).filter(q => q.sourceURL);
    if (!tok || !qs.length) return embedSource(c);
    qs.sort((a, b) => parseInt(b.quality) - parseInt(a.quality));
    const q = qs.find(q => parseInt(q.quality) <= +CFG.quality) || qs[qs.length - 1];
    return { type: 'mp4', url: `${q.sourceURL}?sig=${encodeURIComponent(tok.signature)}&token=${encodeURIComponent(tok.value)}`, fallback: embedSource(c) };
  }
  // Twitch's clip player, if the MP4 won't play. It needs the page's domain, so not when opened as a file.
  const embedSource = c => location.hostname
    ? { type: 'embed', url: `https://clips.twitch.tv/embed?clip=${encodeURIComponent(c.id)}&parent=${location.hostname}&autoplay=true&muted=false` } : null;

  // ---------------- playing a clip ----------------
  let hls = null;
  function loadHlsJs() {
    if (window.Hls) return Promise.resolve();
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js';
      s.onload = res; s.onerror = rej; document.head.appendChild(s);
    });
  }
  // Gets the clip ready to play (true) or gives up (false), before the card shows, so it starts on cue.
  async function prepare(src) {
    if (src.type === 'embed') return true;
    vid.volume = CFG.volume / 100; vid.muted = false;
    const ready = new Promise((res, rej) => {
      vid.oncanplay = res; vid.onerror = () => rej(new Error('video error'));
      setTimeout(() => rej(new Error('timed out')), 10000);
    });
    ready.catch(() => {});
    // (hls.js first: browsers that say they "maybe" play HLS themselves don't all manage Kick's playlists)
    if (src.type === 'hls') await loadHlsJs().catch(() => {});
    if (src.type === 'hls' && window.Hls?.isSupported()) {
      hls = new Hls();
      hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal && vid.onerror) vid.onerror(); });
      hls.loadSource(src.url); hls.attachMedia(vid);
    } else { vid.src = src.url; vid.load(); }
    await ready;
    return true;
  }
  function unload() {
    vid.oncanplay = vid.onerror = vid.onended = null;
    vid.pause(); vid.removeAttribute('src'); vid.load(); vid.classList.remove('on');
    if (hls) { hls.destroy(); hls = null; }
    emb.src = 'about:blank'; emb.classList.remove('on');
    $('prog').style.width = '0';
  }

  // ---------------- the queue ----------------
  const queue = [];
  let busy = false, skipNow = null;
  function enqueue(platform, login, display) {
    const key = platform + ':' + login.toLowerCase();
    if (queue.length >= CFG.maxqueue) return console.info('[clips] the queue is full, so no shoutout for', display);
    // (the lookup starts now, so it's usually done by the time their turn comes)
    queue.push({ key, platform, login, display, info: platform === 'none' ? Promise.resolve(null) : lookup(platform, login) });
    updateMore();
    if (!busy) next();
  }
  function updateMore() { $('more').textContent = queue.length ? `+${queue.length} more` : ''; }
  const timeout = (p, ms) => Promise.race([p, sleep(ms).then(() => null)]);

  async function next() {
    const item = queue.shift();
    if (!item) { busy = false; return; }
    busy = true; updateMore();
    let skipped = false;
    const skipP = new Promise(r => { skipNow = () => { skipped = true; r(); }; });

    const info = await timeout(item.info, 10000);
    let clip = null, src = null;
    if (info?.clips?.length) {
      clip = pickClip(item.key, info.clips);
      src = await timeout(clipSource(item.platform, clip).catch(e => { console.warn('[clips] clip lookup failed', e); }), 8000);
      if (!src && item.platform === 'twitch') src = embedSource(clip);
      // try the clip, then Twitch's player, and if neither plays, the card goes up on its own
      for (let s = src; s; s = s.fallback) {
        try { if (await prepare(s)) { src = s; break; } } catch (e) { console.warn('[clips]', s.type, 'clip did not play:', e.message); unload(); }
        if (!s.fallback) src = null;
      }
    }
    if (skipped) { unload(); return after(); }

    fill(item, info, src && clip);
    so.classList.toggle('noclip', !src);
    so.classList.add('show');
    if (src) {
      // a long clip (when all of theirs were) is cut off at the longest-clip setting
      const len = Math.min(clip.dur || 60, CFG.maxlen || Infinity), t0 = performance.now();
      let ended;
      if (src.type === 'embed') { emb.src = src.url; emb.classList.add('on'); ended = sleep(len * 1000 + 2500); }
      else {
        vid.classList.add('on');
        ended = new Promise(r => { vid.onended = r; });
        vid.play().catch(() => { vid.muted = true; vid.play().catch(() => {}); });
      }
      let raf = 0;
      const prog = () => {
        const t = src.type === 'embed' ? (performance.now() - t0) / 1000 : vid.currentTime;
        $('prog').style.width = Math.min(100, t / len * 100) + '%';
        raf = requestAnimationFrame(prog);
      };
      prog();
      let over = false;
      const cut = src.type === 'embed' ? new Promise(() => {}) : new Promise(r => {
        const chk = () => { if (vid.currentTime >= len) r(); else if (!over) setTimeout(chk, 100); };
        chk();
      });
      await Promise.race([ended, cut, skipP, sleep(len * 1000 + 8000)]);
      over = true;
      cancelAnimationFrame(raf);
      // the sound fades out rather than cutting off
      for (let v = vid.volume; v > 0.02 && !vid.paused; v *= 0.6) { vid.volume = v; await sleep(40); }
    } else {
      await Promise.race([sleep(CFG.cardtime * 1000), skipP]);

  }
  async function after() {
    skipNow = null;

  function fill(item, info, clip) {
    const plat = PLATS[item.platform];
    so.style.setProperty('--plat', plat?.color || '#7a5cff');
    const name = info?.name || item.display;
    $('nm').textContent = name;
    $('ini').textContent = [...name][0]?.toUpperCase() || '?';

    if (info?.avatar) img.src = info.avatar; else img.removeAttribute('src');
    const game = $('game');
    game.textContent = '';
    if (CFG.game && info?.game) {
      if (info.live) { const l = document.createElement('span'); l.className = 'live'; l.textContent = 'LIVE'; game.append(l, 'Playing '); }
      else game.append('Last seen playing ');
      const b = document.createElement('b'); b.textContent = info.game; game.append(b);
    }
    $('url').classList.toggle('off', !(info && plat));
    if (info && plat) { $('plat').textContent = plat.label; $('link').textContent = plat.url(info.login); }
    $('tag').textContent = CFG.tagline.replace(/\{name\}/gi, name);

  // "!so name", "!so @name", "!so twitch.tv/name", "!so kick.com/name", "!so kick:name"
  function shoutout(arg, from) {
    let s = String(arg || '').trim().split(/\s+/)[0] || '', platform = null;
    const m = /^(?:https?:\/\/)?(?:www\.)?(twitch\.tv|kick\.com)\/([^/?#\s]+)/i.exec(s) || /^(twitch|kick):@?(\S+)/i.exec(s);
    if (m) { platform = /^kick/i.test(m[1]) ? 'kick' : 'twitch'; s = m[2]; }
    s = s.replace(/^@/, '').replace(/[^\w-]/g, '');
    if (!s) return;
    if (!platform) platform = from === 'twitch' || from === 'kick' ? from : CFG.lookup;
    enqueue(platform, s, s);
  }

    if (all) { queue.length = 0; updateMore(); }

    shoutout: (name, o = {}) => shoutout(name, o.platform || 'custom'),
    skip: () => skip(false),
    clear: () => skip(true),
  };

  // ---------------- chat ----------------
  function handleChat({ name, text, platform = 'custom', owner = false, mod = false, vip = false }) {
    if (!name) return;
    const plain = (text || '').trim(), cmd = plain.split(/\s+/)[0].toLowerCase(), arg = plain.slice(cmd.length).trim();
    if (cmd === CFG.socmd) {
      const ok = owner || ALLOW.has(String(name).toLowerCase()) ||
        (CFG.who === 'everyone') || (CFG.who === 'mods' && mod) || (CFG.who === 'vips' && (mod || vip));
      if (ok && arg) shoutout(arg, platform);
    } else if (cmd === CFG.skipcmd && (owner || mod)) skip(/^all\b/i.test(arg));
  }

  // ---------------- Twitch (anonymous IRC over WebSocket) ----------------
  function parseTags(raw) {
    const o = {};
    const un = v => v.replace(/\\(.)/g, (_, c) => ({ s: ' ', ':': ';', '\\': '\\', r: '\r', n: '\n' }[c] ?? c));
    raw.split(';').forEach(kv => { const i = kv.indexOf('='); o[kv.slice(0, i)] = un(kv.slice(i + 1)); });
    return o;
  }
  function connectTwitch(channel) {
    const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    ws.onopen = () => {
      ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      ws.send('PASS SCHMOOPIIE');
      ws.send('NICK justinfan' + Math.floor(10000 + Math.random() * 80000));
      ws.send('JOIN #' + channel);
    };
    ws.onmessage = (ev) => {
      for (const line of ev.data.split('\r\n')) {
        if (!line) continue;
        if (line.startsWith('PING')) { ws.send('PONG :tmi.twitch.tv'); continue; }
        const m = /^(?:@(\S+) )?:([^!\s]+)![^ ]+ PRIVMSG #\S+ :(.*)$/.exec(line);
        if (!m) continue;
        const tags = m[1] ? parseTags(m[1]) : {}, badges = tags.badges || '';
        handleChat({ name: tags['display-name'] || m[2], text: m[3], platform: 'twitch',
          owner: /(^|,)broadcaster\//.test(badges) || m[2] === channel,
          mod: tags.mod === '1' || /(^|,)moderator\//.test(badges),
          vip: tags.vip === '1' || /(^|,)vip\//.test(badges) });
      }
    };
    ws.onclose = () => setTimeout(() => connectTwitch(channel), 3000);
  }

  // ---------------- Kick (anonymous, Kick's public Pusher chat socket) ----------------
  const KICK_PUSHER = 'wss://ws-us2.pusher.com/app/32cbd69e4b950bf97679?protocol=7&client=js&version=8.4.0&flash=false';
  async function connectKick(slug) {
    let chatroom;
    try {
      const r = await fetch(`https://kick.com/api/v2/channels/${encodeURIComponent(slug)}`);
      chatroom = (await r.json()).chatroom?.id;
      if (!chatroom) throw new Error('no chatroom');
    } catch (e) { console.warn('[clips] Kick channel lookup failed for', slug, e); return setTimeout(() => connectKick(slug), 30000); }
    kickSocket(chatroom);
  }
  function kickSocket(chatroom) {
    const ws = new WebSocket(KICK_PUSHER);
    ws.onmessage = (ev) => {
      let o; try { o = JSON.parse(ev.data); } catch { return; }
      if (o.event === 'pusher:connection_established') {
        ws.send(JSON.stringify({ event: 'pusher:subscribe', data: { auth: '', channel: `chatrooms.${chatroom}.v2` } }));
        return;
      }
      if (o.event === 'pusher:ping') { ws.send(JSON.stringify({ event: 'pusher:pong', data: {} })); return; }
      let d; try { d = typeof o.data === 'string' ? JSON.parse(o.data) : o.data; } catch { return; }
      if (!d || String(o.event).split('\\').pop() !== 'ChatMessageEvent') return;
      const s = d.sender || {}, badges = (s.identity?.badges || []).map(b => b.type);
      handleChat({ name: s.username, text: (d.content || '').replace(/\[emote:\d+:([^\]]+)\]/g, '$1'), platform: 'kick',
        owner: badges.includes('broadcaster') || String(s.slug || s.username || '').toLowerCase() === CFG.kick,
        mod: badges.includes('moderator'), vip: badges.includes('vip') });
    };
    ws.onclose = () => setTimeout(() => kickSocket(chatroom), 3000);
    ws.onerror = () => {};
  }

  // ---------------- WebSocket bridges (TikFinity for TikTok, or any bridge for YouTube) ----------------
  function connectBridge(url, platform) {
    let ws;
    try { ws = new WebSocket(url); } catch (e) { return setTimeout(() => connectBridge(url, platform), 5000); }
    ws.onmessage = (ev) => {
      let o; try { o = JSON.parse(ev.data); } catch { return; }
      const type = (o.event || o.type || '').toString().toLowerCase(), d = o.data || o;
      if (type && !['chat', 'comment', 'message', 'chatmessage'].includes(type)) return;
      const name = d.nickname || d.uniqueId || d.displayName || d.chatname || d.user?.nickname || d.user?.uniqueId || d.user?.name || d.username;
      const text = d.comment || d.message || d.text || d.chatmessage;
      if (name && typeof text === 'string')
        handleChat({ name, text, platform, owner: !!(d.isOwner || d.isStreamer || d.isBroadcaster || d.isChatOwner),
          mod: !!(d.isModerator || d.isMod || d.isChatModerator) });
    };
    ws.onclose = () => setTimeout(() => connectBridge(url, platform), 3000);
    ws.onerror = () => {};
  }

  // ---------------- YouTube (Data API v3 polling) ----------------
  async function connectYouTube(videoId, key) {
    const API = 'https://www.googleapis.com/youtube/v3/';
    const retry = () => setTimeout(() => connectYouTube(videoId, key), 30000);
    let chatId;
    try {
      const r = await fetch(`${API}videos?part=liveStreamingDetails&id=${encodeURIComponent(videoId)}&key=${encodeURIComponent(key)}`);
      chatId = (await r.json()).items?.[0]?.liveStreamingDetails?.activeLiveChatId;
      if (!chatId) { console.warn('[clips] YouTube: no active live chat for', videoId); return retry(); }
    } catch (e) { return retry(); }
    let pageToken = '', first = true;
    const poll = async () => {
      let wait = CFG.ytpoll * 1000;
      try {
        const r = await fetch(`${API}liveChat/messages?liveChatId=${encodeURIComponent(chatId)}&part=snippet,authorDetails&maxResults=200&key=${encodeURIComponent(key)}${pageToken ? '&pageToken=' + pageToken : ''}`);
        const j = await r.json();
        if (j.error) { if (r.status === 403 || r.status === 404) return retry(); wait = 15000; }
        else {
          pageToken = j.nextPageToken || pageToken;
          wait = Math.max(wait, j.pollingIntervalMillis || 0);
          // (the backlog from before connecting is skipped)
          if (!first) for (const it of j.items || []) if (it.snippet?.displayMessage)
            handleChat({ name: it.authorDetails?.displayName, text: it.snippet.displayMessage, platform: 'youtube',
              owner: !!it.authorDetails?.isChatOwner, mod: !!it.authorDetails?.isChatModerator });
          first = false;
        }
      } catch (e) { wait = 15000; }
      setTimeout(poll, wait);
    };
    poll();
  }

      if (f.type === 'bool') {
        const row = document.createElement('div'); row.className = 'sp-row';
        const sw = document.createElement('span'); sw.className = 'sw';
        inp = document.createElement('input'); inp.type = 'checkbox';
        sw.append(inp, document.createElement('i'));
        row.append(lab, sw); wrapF.appendChild(row);
      } else if (f.type === 'select') {
        inp = document.createElement('select');
        for (const [v, t] of f.opts) { const o = document.createElement('option'); o.value = v; o.textContent = t; inp.appendChild(o); }
        wrapF.append(lab, inp);
      } else {
        inp = document.createElement('input');
        inp.type = f.type === 'num' ? 'number' : f.type;
        if (f.type === 'num') { inp.min = f.min; inp.max = f.max; inp.step = f.step; }
        if (f.ph) inp.placeholder = f.ph;
        inp.spellcheck = false; inp.autocomplete = 'off';
        wrapF.append(lab, inp);
      }
      inp.id = id;
      if (f.help) { const sm = document.createElement('small'); sm.textContent = f.help; wrapF.appendChild(sm); }
      if (f.k in fromURL) {
        inp.disabled = true;
        const sm = document.createElement('small'); sm.className = 'url';
        sm.textContent = 'Set by the source URL, which overrides this.';
        wrapF.appendChild(sm);
      }
      inputs[f.k] = inp;
      sec.appendChild(wrapF);
    }

    const fill = (vals) => {
      for (const [k, inp] of Object.entries(inputs)) {
        const v = vals[k];
        if (FIELD[k].type === 'bool') inp.checked = !!v; else inp.value = v;
      }
    };
    const read = () => {
      const out = {};
      for (const [k, inp] of Object.entries(inputs)) out[k] = coerce(FIELD[k], FIELD[k].type === 'bool' ? inp.checked : inp.value);
      return out;
    };
    const open = () => {
      fill(SET);
      msg.textContent = storageOK ? '' : 'This browser source can\'t save settings — use "Copy setup link" instead.';
      linkBox.style.display = 'none';
      panel.classList.add('open');
    };
    const close = () => panel.classList.remove('open');

    gear.addEventListener('click', open);
    panel.addEventListener('mousedown', e => { if (e.target === panel) close(); });
    addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

    panel.querySelector('.sp-foot').addEventListener('click', e => {
      const act = e.target.dataset && e.target.dataset.act;
      if (!act) return;
      if (act === 'close') close();
      if (act === 'test') {
        const vals = read(), n = vals.channel || vals.kick;
        if (!n) { msg.textContent = 'Fill in your Twitch or Kick channel first — the test shouts you out.'; return; }
        shoutout(vals.channel ? 'twitch:' + vals.channel : 'kick:' + vals.kick, 'custom');
        close();
      }
      if (act === 'defaults') {
        const d = {}; for (const f of Object.values(FIELD)) d[f.k] = f.def;
        fill(d); msg.textContent = 'Defaults filled in — press Save & apply to keep them.';
      }
      if (act === 'link') {
        const vals = read(), q = new URLSearchParams();
        for (const f of Object.values(FIELD)) {
          const v = vals[f.k];
          if (v === f.def) continue;
          q.set(f.k, f.type === 'bool' ? (v ? '1' : '0') : String(v));
        }
        const link = location.href.split(/[?#]/)[0] + (q.toString() ? '?' + q.toString() : '');
        linkBox.value = link; linkBox.style.display = 'block'; linkBox.select();
        const done = () => { msg.textContent = 'Setup link copied' + (vals.ytkey ? ' (it includes your YouTube API key — keep it private).' : '.'); };
        try { navigator.clipboard.writeText(link).then(done, () => { document.execCommand('copy'); done(); }); }
        catch (err) { try { document.execCommand('copy'); done(); } catch (e2) { msg.textContent = 'Copy the link from the box below.'; } }
      }
      if (act === 'save') {
        try {
          const vals = read();
          // fields locked by the URL keep whatever was saved before (the URL value isn't a choice made here)
          for (const k in fromURL) { if (k in saved) vals[k] = coerce(FIELD[k], saved[k]); else delete vals[k]; }
          localStorage.setItem(STORE_KEY, JSON.stringify(vals));
          msg.textContent = 'Saved! Reloading…';
          setTimeout(() => location.reload(), 250);
        } catch (err) {
          msg.textContent = 'Couldn\'t save here — use "Copy setup link" and paste it as the source URL.';
        }
      }
    });

    // the buttons only appear while a mouse is over the overlay (i.e. in OBS's Interact window)
    let mt;
    addEventListener('mousemove', () => {
      document.body.classList.add('mouse');
      clearTimeout(mt); mt = setTimeout(() => document.body.classList.remove('mouse'), 3000);
    });
    document.addEventListener('mouseleave', () => document.body.classList.remove('mouse'));
  })();

  if (CFG.channel) connectTwitch(CFG.channel);
  if (CFG.kick) connectKick(CFG.kick);
  if (CFG.tiktok) connectBridge(CFG.tiktok, 'tiktok');
  if (CFG.youtube) {
    if (/^wss?:\/\//i.test(CFG.youtube)) connectBridge(CFG.youtube, 'youtube');
    else if (CFG.ytkey) connectYouTube(ytId(CFG.youtube), CFG.ytkey);
    else console.warn('[clips] youtube= needs ytkey= (or a ws:// bridge URL)');
  }
  if (CFG.demo) runDemo();
  if (!CFG.channel && !CFG.kick && !CFG.tiktok && !CFG.youtube && !CFG.demo)
    toast('No chat connected yet: move the mouse over the overlay and click the gear, or add ?channel=yourchannel');
})();
</script>
</body>
</html>
